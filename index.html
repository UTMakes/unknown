<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Labs - Node Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1f2e;
            color: #e0e6ed;
            overflow: hidden;
            user-select: none;
        }

        /* Blueprint Grid Background */
        .blueprint-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e2532;
            background-image: 
                linear-gradient(rgba(60, 70, 90, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(60, 70, 90, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        /* UI Layout */
        .game-container {
            display: grid;
            grid-template-areas: 
                "resources topnav settings"
                "canvas canvas rightbar"
                "toolbar toolbar rightbar";
            grid-template-columns: 300px 1fr 60px;
            grid-template-rows: 80px 1fr 70px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* Resources Panel (Top Left) */
        .resources-panel {
            grid-area: resources;
            background: rgba(30, 37, 50, 0.9);
            border: 1px solid #3c465a;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .resource-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .resource-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .resource-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .resource-value {
            font-weight: 600;
            color: #fff;
            min-width: 60px;
        }

        .resource-rate {
            color: #8b92a8;
            font-size: 12px;
        }

        .timer-row {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3c465a;
        }

        .timer-bar {
            width: 100%;
            height: 4px;
            background: #2a3447;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            width: 100%;
            transition: width 1s linear;
        }

        /* Top Navigation */
        .top-nav {
            grid-area: topnav;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            padding-top: 10px;
        }

        .nav-btn {
            background: rgba(30, 37, 50, 0.9);
            border: 1px solid #3c465a;
            color: #8b92a8;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(60, 70, 90, 0.5);
            color: #fff;
            border-color: #5a6a8a;
        }

        .nav-btn.home {
            background: #ff6b35;
            color: #fff;
            border-color: #ff6b35;
        }

        /* Right Sidebar */
        .right-bar {
            grid-area: rightbar;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            padding-top: 10px;
        }

        .sidebar-btn {
            width: 44px;
            height: 44px;
            background: rgba(30, 37, 50, 0.9);
            border: 1px solid #3c465a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #8b92a8;
            font-size: 20px;
            position: relative;
        }

        .sidebar-btn:hover {
            background: rgba(60, 70, 90, 0.5);
            color: #fff;
            transform: translateX(-2px);
        }

        .sidebar-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Main Canvas Area */
        .canvas-area {
            grid-area: canvas;
            background: rgba(20, 25, 35, 0.5);
            border: 1px solid #3c465a;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        .canvas-content {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        /* Nodes */
        .node {
            position: absolute;
            width: 120px;
            background: rgba(30, 37, 50, 0.95);
            border: 2px solid #4a5568;
            border-radius: 8px;
            padding: 10px;
            cursor: move;
            transition: box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .node:hover {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
        }

        .node.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .node.running {
            border-color: #10b981;
            animation: pulse-green 2s infinite;
        }

        .node.error {
            border-color: #ef4444;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
        }

        .node-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #3c465a;
        }

        .node-icon {
            width: 24px;
            height: 24px;
            background: #3c465a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .node-title {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }

        .node-body {
            font-size: 11px;
            color: #8b92a8;
        }

        .node-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 10px;
        }

        .node-output {
            color: #10b981;
        }

        .node-level {
            color: #f59e0b;
        }

        /* Connection Lines */
        .connection {
            position: absolute;
            pointer-events: none;
            z-index: -1;
        }

        .connection-line {
            stroke: #4a5568;
            stroke-width: 2;
            fill: none;
        }

        .connection-line.active {
            stroke: #10b981;
            stroke-dasharray: 5,5;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -10; }
        }

        /* Ports */
        .port {
            width: 12px;
            height: 12px;
            background: #4a5568;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            transition: all 0.2s;
        }

        .port:hover {
            background: #60a5fa;
            transform: scale(1.2);
        }

        .port.input { left: -6px; top: 50%; transform: translateY(-50%); }
        .port.output { right: -6px; top: 50%; transform: translateY(-50%); }

        /* Toolbar */
        .toolbar {
            grid-area: toolbar;
            background: rgba(30, 37, 50, 0.9);
            border: 1px solid #3c465a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }

        .tool-section {
            display: flex;
            gap: 8px;
            padding-right: 15px;
            border-right: 1px solid #3c465a;
        }

        .tool-section:last-child {
            border-right: none;
            margin-left: auto;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            background: rgba(40, 50, 70, 0.5);
            border: 1px solid #3c465a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #8b92a8;
            font-size: 20px;
            position: relative;
        }

        .tool-btn:hover {
            background: rgba(60, 70, 90, 0.8);
            color: #fff;
            transform: translateY(-2px);
        }

        .tool-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .tool-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .tool-cost {
            position: absolute;
            bottom: -18px;
            font-size: 10px;
            color: #f59e0b;
            white-space: nowrap;
        }

        /* Achievement Popup */
        .achievement-popup {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 37, 50, 0.98);
            border: 1px solid #3c465a;
            border-radius: 8px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 1000;
        }

        .achievement-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .achievement-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .achievement-text h4 {
            color: #fff;
            margin-bottom: 4px;
        }

        .achievement-text p {
            color: #8b92a8;
            font-size: 12px;
        }

        /* Context Menu */
        .context-menu {
            position: absolute;
            background: rgba(30, 37, 50, 0.98);
            border: 1px solid #3c465a;
            border-radius: 6px;
            padding: 5px 0;
            min-width: 150px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }

        .context-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .context-item:hover {
            background: rgba(60, 70, 90, 0.5);
        }

        .context-item.delete {
            color: #ef4444;
        }

        /* Floating Text */
        .floating-text {
            position: absolute;
            color: #10b981;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1e2532;
            border: 1px solid #3c465a;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3c465a;
        }

        .modal-title {
            font-size: 20px;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #8b92a8;
            font-size: 24px;
            cursor: pointer;
        }

        .upgrade-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-item {
            background: rgba(40, 50, 70, 0.5);
            border: 1px solid #3c465a;
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-item:hover:not(.disabled) {
            border-color: #3b82f6;
            background: rgba(60, 70, 90, 0.5);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-info h4 {
            color: #fff;
            margin-bottom: 4px;
        }

        .upgrade-info p {
            color: #8b92a8;
            font-size: 12px;
        }

        .upgrade-cost {
            color: #f59e0b;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .game-container {
                grid-template-columns: 250px 1fr 50px;
            }
        }
    </style>
</head>
<body>
    <div class="blueprint-bg"></div>

    <div class="game-container">
        <!-- Resources Panel -->
        <div class="resources-panel">
            <div class="resource-row">
                <div class="resource-left">
                    <span class="resource-icon">💰</span>
                    <span class="resource-value" id="money">0</span>
                </div>
                <span class="resource-rate" id="moneyRate">0.00/s</span>
            </div>
            <div class="resource-row">
                <div class="resource-left">
                    <span class="resource-icon">🧪</span>
                    <span class="resource-value" id="research">0</span>
                </div>
                <span class="resource-rate" id="researchRate">0.00/s</span>
            </div>
            <div class="resource-row">
                <div class="resource-left">
                    <span class="resource-icon">🎯</span>
                    <span class="resource-value" id="hacks">0</span>
                </div>
                <span class="resource-rate" id="hacksRate">0.00/s</span>
            </div>
            <div class="resource-row">
                <div class="resource-left">
                    <span class="resource-icon">📊</span>
                    <span class="resource-value" id="data">0</span>
                </div>
                <span class="resource-rate" id="dataRate">0.00/s</span>
            </div>
            <div class="resource-row">
                <div class="resource-left">
                    <span class="resource-icon">⏱️</span>
                    <span class="resource-value" id="uptime">0</span>
                </div>
            </div>
            
            <div class="timer-row">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8b92a8;">
                    <span>Session Time</span>
                    <span id="sessionTime">600s</span>
                </div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
            </div>
        </div>

        <!-- Top Navigation -->
        <div class="top-nav">
            <button class="nav-btn home active" onclick="switchTab('desktop')">
                <span>🏠</span> Desktop
            </button>
            <button class="nav-btn" onclick="switchTab('research')">
                <span>🧪</span> Research
            </button>
            <button class="nav-btn" onclick="switchTab('network')">
                <span>🌐</span> Network
            </button>
        </div>

        <!-- Settings Button -->
        <div class="right-bar" style="justify-content: flex-start;">
            <button class="sidebar-btn" onclick="toggleModal('settings')" title="Settings">
                ⚙️
            </button>
        </div>

        <!-- Right Sidebar -->
        <div class="right-bar">
            <button class="sidebar-btn active" onclick="toggleModal('achievements')" title="Achievements">
                🏆
                <span class="notification-badge" id="achBadge" style="display:none;">1</span>
            </button>
            <button class="sidebar-btn" onclick="toggleModal('upgrades')" title="Upgrades">
                📖
            </button>
            <button class="sidebar-btn" onclick="toggleModal('inventory')" title="Inventory">
                🎒
            </button>
            <button class="sidebar-btn" onclick="toggleModal('prestige')" title="Prestige">
                ⚛️
            </button>
            <div style="flex-grow: 1;"></div>
            <button class="sidebar-btn" onclick="toggleModal('help')" title="Help">
                ❓
            </button>
            <button class="sidebar-btn" onclick="toggleFullscreen()" title="Fullscreen">
                ⛶
            </button>
        </div>

        <!-- Main Canvas -->
        <div class="canvas-area" id="canvasArea">
            <svg class="canvas-content" id="connectionLayer">
                <!-- Connections drawn here -->
            </svg>
            <div class="canvas-content" id="nodeLayer">
                <!-- Nodes placed here -->
            </div>
        </div>

        <!-- Bottom Toolbar -->
        <div class="toolbar">
            <div class="tool-section">
                <button class="tool-btn active" id="toolSelect" onclick="setTool('select')" title="Select (V)">
                    🖱️
                </button>
                <button class="tool-btn" id="toolMove" onclick="setTool('move')" title="Move (M)">
                    ✥
                </button>
                <button class="tool-btn" id="toolDelete" onclick="setTool('delete')" title="Delete (X)">
                    🗑️
                </button>
            </div>
            
            <div class="tool-section">
                <button class="tool-btn" onclick="createNode('scanner')" title="Port Scanner">
                    🌐
                    <span class="tool-cost">$100</span>
                </button>
                <button class="tool-btn" onclick="createNode('exploit')" title="Exploit Engine">
                    ⚙️
                    <span class="tool-cost">$500</span>
                </button>
                <button class="tool-btn" onclick="createNode('payload')" title="Payload Gen">
                    💻
                    <span class="tool-cost">$200</span>
                </button>
                <button class="tool-btn" onclick="createNode('crypto')" title="Crypto Miner">
                    ⛏️
                    <span class="tool-cost">$1000</span>
                </button>
                <button class="tool-btn" onclick="createNode('firewall')" title="Firewall">
                    🛡️
                    <span class="tool-cost">$300</span>
                </button>
                <button class="tool-btn" onclick="createNode('database')" title="Database">
                    🗄️
                    <span class="tool-cost">$800</span>
                </button>
                <button class="tool-btn" onclick="createNode('ai')" title="AI Core">
                    🧠
                    <span class="tool-cost">$5000</span>
                </button>
            </div>

            <div class="tool-section">
                <button class="tool-btn" onclick="clearAllNodes()" title="Clear All">
                    🗑️
                </button>
                <button class="tool-btn" onclick="saveLayout()" title="Save Layout">
                    💾
                </button>
            </div>
        </div>
    </div>

    <!-- Achievement Popup -->
    <div class="achievement-popup" id="achievementPopup">
        <div class="achievement-icon">🏆</div>
        <div class="achievement-text">
            <h4>New Achievement</h4>
            <p id="achievementName">First Hack</p>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-item" onclick="upgradeSelectedNode()">Upgrade Node</div>
        <div class="context-item" onclick="duplicateNode()">Duplicate</div>
        <div class="context-item delete" onclick="deleteSelectedNode()">Delete Node</div>
    </div>

    <!-- Modals -->
    <div class="modal" id="modal-upgrades">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">🚀 System Upgrades</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="upgrade-list" id="upgradeList">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <div class="modal" id="modal-achievements">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">🏆 Achievements</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div id="achievementList">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <script>
        // Game State
        const game = {
            resources: {
                money: 0,
                research: 0,
                hacks: 0,
                data: 0,
                uptime: 0
            },
            rates: {
                money: 0,
                research: 0,
                hacks: 0,
                data: 0
            },
            nodes: [],
            connections: [],
            selectedNode: null,
            currentTool: 'select',
            nodeIdCounter: 0,
            achievements: [],
            upgrades: {
                scanSpeed: 1,
                exploitPower: 1,
                cryptoEfficiency: 1,
                maxNodes: 10
            },
            sessionTime: 600,
            lastTick: Date.now()
        };

        // Node Types Configuration
        const nodeTypes = {
            scanner: {
                name: 'Port Scanner',
                icon: '🌐',
                color: '#3b82f6',
                cost: 100,
                inputs: 0,
                outputs: 1,
                production: { hacks: 0.5 },
                description: 'Scans for open ports'
            },
            exploit: {
                name: 'Exploit Engine',
                icon: '⚙️',
                color: '#ef4444',
                cost: 500,
                inputs: 1,
                outputs: 1,
                production: { hacks: 2, data: 0.1 },
                description: 'Runs exploitation scripts'
            },
            payload: {
                name: 'Payload Gen',
                icon: '💻',
                color: '#10b981',
                cost: 200,
                inputs: 1,
                outputs: 1,
                production: { data: 0.5 },
                description: 'Generates malicious payloads'
            },
            crypto: {
                name: 'Crypto Miner',
                icon: '⛏️',
                color: '#f59e0b',
                cost: 1000,
                inputs: 0,
                outputs: 1,
                production: { money: 1 },
                description: ' Mines cryptocurrency'
            },
            firewall: {
                name: 'Firewall',
                icon: '🛡️',
                color: '#8b5cf6',
                cost: 300,
                inputs: 1,
                outputs: 1,
                production: {},
                description: 'Protects network, boosts efficiency'
            },
            database: {
                name: 'Database',
                icon: '🗄️',
                color: '#ec4899',
                cost: 800,
                inputs: 2,
                outputs: 0,
                production: {},
                description: 'Stores stolen data for profit'
            },
            ai: {
                name: 'AI Core',
                icon: '🧠',
                color: '#06b6d4',
                cost: 5000,
                inputs: 3,
                outputs: 2,
                production: { research: 0.5, hacks: 5, data: 1 },
                description: 'Automates complex operations'
            }
        };

        // Initialize
        function init() {
            updateResources();
            setInterval(gameLoop, 100);
            setInterval(secondLoop, 1000);
            
            // Canvas interactions
            const canvas = document.getElementById('canvasArea');
            canvas.addEventListener('mousedown', handleCanvasClick);
            canvas.addEventListener('contextmenu', handleRightClick);
            canvas.addEventListener('mousemove', handleMouseMove);
            
            document.addEventListener('keydown', handleKeyDown);
            
            // Start with one free scanner
            setTimeout(() => createNode('scanner', 100, 100), 500);
        }

        function gameLoop() {
            const now = Date.now();
            const delta = (now - game.lastTick) / 1000;
            game.lastTick = now;
            
            // Update nodes
            game.nodes.forEach(node => {
                if (node.type === 'database') {
                    // Database converts data to money
                    const inputData = getInputResources(node);
                    if (inputData.data > 0) {
                        game.resources.money += inputData.data * 10 * delta;
                        game.resources.data -= inputData.data * delta;
                    }
                } else if (node.type === 'firewall') {
                    // Firewall boosts connected nodes
                    const boosted = getConnectedNodes(node);
                    boosted.forEach(target => {
                        target.efficiency = 1.5;
                    });
                } else {
                    // Normal production
                    const type = nodeTypes[node.type];
                    if (type.production) {
                        Object.entries(type.production).forEach(([res, amount]) => {
                            const efficiency = node.efficiency || 1;
                            game.resources[res] += amount * efficiency * delta;
                        });
                    }
                }
            });
            
            updateResources();
        }

        function secondLoop() {
            game.sessionTime--;
            document.getElementById('sessionTime').textContent = game.sessionTime + 's';
            document.getElementById('timerFill').style.width = (game.sessionTime / 600 * 100) + '%';
            
            if (game.sessionTime <= 0) {
                // Reset session with bonus
                game.sessionTime = 600;
                game.resources.money += 1000;
                showAchievement('Session Complete', 'Bonus: $1000');
            }
            
            // Calculate rates
            game.rates = { money: 0, research: 0, hacks: 0, data: 0 };
            game.nodes.forEach(node => {
                const type = nodeTypes[node.type];
                if (type.production) {
                    Object.entries(type.production).forEach(([res, amount]) => {
                        game.rates[res] += amount * (node.efficiency || 1);
                    });
                }
            });
            
            // Update rate displays
            Object.keys(game.rates).forEach(res => {
                const el = document.getElementById(res + 'Rate');
                if (el) el.textContent = game.rates[res].toFixed(2) + '/s';
            });
            
            game.resources.uptime++;
            document.getElementById('uptime').textContent = formatTime(game.resources.uptime);
        }

        function createNode(type, x, y) {
            if (game.nodes.length >= game.upgrades.maxNodes) {
                showFloatingText(event?.clientX || 400, event?.clientY || 300, 'Max nodes reached!');
                return;
            }
            
            const config = nodeTypes[type];
            if (game.resources.money < config.cost && game.nodes.length > 0) {
                showFloatingText(event?.clientX || 400, event?.clientY || 300, 'Not enough money!');
                return;
            }
            
            if (game.nodes.length > 0) {
                game.resources.money -= config.cost;
            }
            
            const node = {
                id: game.nodeIdCounter++,
                type: type,
                x: x || Math.random() * 600 + 50,
                y: y || Math.random() * 400 + 50,
                level: 1,
                efficiency: 1,
                inputs: [],
                outputs: []
            };
            
            game.nodes.push(node);
            renderNode(node);
            
            // Check achievements
            if (game.nodes.length === 1) unlockAchievement('first_node', 'First Node');
            if (game.nodes.length === 10) unlockAchievement('ten_nodes', 'Network Builder');
            
            return node;
        }

        function renderNode(node) {
            const config = nodeTypes[node.type];
            const div = document.createElement('div');
            div.className = 'node';
            div.id = 'node-' + node.id;
            div.style.left = node.x + 'px';
            div.style.top = node.y + 'px';
            div.style.borderColor = config.color;
            
            div.innerHTML = `
                <div class="port input" onclick="startConnection(${node.id}, 'input')"></div>
                <div class="port output" onclick="startConnection(${node.id}, 'output')"></div>
                <div class="node-header">
                    <div class="node-icon" style="background: ${config.color}20; color: ${config.color};">
                        ${config.icon}
                    </div>
                    <div class="node-title">${config.name}</div>
                </div>
                <div class="node-body">
                    ${config.description}
                </div>
                <div class="node-stats">
                    <span class="node-level">Lv.${node.level}</span>
                    <span class="node-output">${node.efficiency > 1 ? '⚡' : ''}</span>
                </div>
            `;
            
            // Drag functionality
            let isDragging = false;
            let startX, startY, initialX, initialY;
            
            div.addEventListener('mousedown', (e) => {
                if (game.currentTool === 'select') {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialX = node.x;
                    initialY = node.y;
                    selectNode(node);
                    e.stopPropagation();
                } else if (game.currentTool === 'delete') {
                    deleteNode(node);
                }
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    node.x = initialX + dx;
                    node.y = initialY + dy;
                    div.style.left = node.x + 'px';
                    div.style.top = node.y + 'px';
                    updateConnections();
                }
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            document.getElementById('nodeLayer').appendChild(div);
        }

        function selectNode(node) {
            game.selectedNode = node;
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            document.getElementById('node-' + node.id).classList.add('selected');
        }

        function deleteNode(node) {
            const idx = game.nodes.indexOf(node);
            if (idx > -1) {
                game.nodes.splice(idx, 1);
                document.getElementById('node-' + node.id).remove();
                
                // Remove connections
                game.connections = game.connections.filter(c => {
                    if (c.from === node.id || c.to === node.id) {
                        document.getElementById('conn-' + c.id)?.remove();
                        return false;
                    }
                    return true;
                });
            }
        }

        let connectionStart = null;

        function startConnection(nodeId, type) {
            if (!connectionStart) {
                connectionStart = { node: nodeId, type: type };
            } else {
                // Complete connection
                if (connectionStart.node !== nodeId) {
                    if (connectionStart.type === 'output' && type === 'input') {
                        createConnection(connectionStart.node, nodeId);
                    } else if (connectionStart.type === 'input' && type === 'output') {
                        createConnection(nodeId, connectionStart.node);
                    }
                }
                connectionStart = null;
            }
        }

        function createConnection(fromId, toId) {
            const id = 'conn-' + Date.now();
            game.connections.push({ id, from: fromId, to: toId });
            drawConnection(id, fromId, toId);
        }

        function drawConnection(id, fromId, toId) {
            const fromNode = game.nodes.find(n => n.id === fromId);
            const toNode = game.nodes.find(n => n.id === toId);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            line.setAttribute('id', id);
            line.setAttribute('class', 'connection-line active');
            
            const fromEl = document.getElementById('node-' + fromId);
            const toEl = document.getElementById('node-' + toId);
            
            const x1 = fromNode.x + 120;
            const y1 = fromNode.y + 40;
            const x2 = toNode.x;
            const y2 = toNode.y + 40;
            
            const midX = (x1 + x2) / 2;
            const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
            line.setAttribute('d', d);
            
            document.getElementById('connectionLayer').appendChild(line);
        }

        function updateConnections() {
            game.connections.forEach(conn => {
                const line = document.getElementById(conn.id);
                if (line) {
                    const fromNode = game.nodes.find(n => n.id === conn.from);
                    const toNode = game.nodes.find(n => n.id === conn.to);
                    
                    const x1 = fromNode.x + 120;
                    const y1 = fromNode.y + 40;
                    const x2 = toNode.x;
                    const y2 = toNode.y + 40;
                    
                    const midX = (x1 + x2) / 2;
                    const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
                    line.setAttribute('d', d);
                }
            });
        }

        function getInputResources(node) {
            const inputs = {};
            game.connections.filter(c => c.to === node.id).forEach(c => {
                const fromNode = game.nodes.find(n => n.id === c.from);
                const type = nodeTypes[fromNode.type];
                if (type.production) {
                    Object.entries(type.production).forEach(([res, amount]) => {
                        inputs[res] = (inputs[res] || 0) + amount;
                    });
                }
            });
            return inputs;
        }

        function getConnectedNodes(node) {
            return game.connections
                .filter(c => c.from === node.id)
                .map(c => game.nodes.find(n => n.id === c.to));
        }

        function upgradeSelectedNode() {
            if (!game.selectedNode) return;
            const cost = Math.floor(nodeTypes[game.selectedNode.type].cost * Math.pow(1.5, game.selectedNode.level));
            if (game.resources.money >= cost) {
                game.resources.money -= cost;
                game.selectedNode.level++;
                game.selectedNode.efficiency *= 1.5;
                renderNode(game.selectedNode);
                showFloatingText(event.clientX, event.clientY, 'Upgraded!');
            }
        }

        function setTool(tool) {
            game.currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1))?.classList.add('active');
        }

        function handleCanvasClick(e) {
            if (e.target === document.getElementById('canvasArea') || e.target.id === 'nodeLayer') {
                game.selectedNode = null;
                document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
                document.getElementById('contextMenu').style.display = 'none';
            }
        }

        function handleRightClick(e) {
            e.preventDefault();
            if (game.selectedNode) {
                const menu = document.getElementById('contextMenu');
                menu.style.display = 'block';
                menu.style.left = e.clientX + 'px';
                menu.style.top = e.clientY + 'px';
            }
        }

        function handleMouseMove(e) {
            // Could add connection preview here
        }

        function handleKeyDown(e) {
            switch(e.key.toLowerCase()) {
                case 'v': setTool('select'); break;
                case 'm': setTool('move'); break;
                case 'x': setTool('delete'); break;
                case 'delete': 
                case 'backspace': 
                    if (game.selectedNode) deleteNode(game.selectedNode);
                    break;
            }
        }

        function updateResources() {
            document.getElementById('money').textContent = formatNumber(game.resources.money);
            document.getElementById('research').textContent = formatNumber(game.resources.research);
            document.getElementById('hacks').textContent = formatNumber(game.resources.hacks);
            document.getElementById('data').textContent = formatNumber(game.resources.data);
        }

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return Math.floor(num).toString();
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function showFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function unlockAchievement(id, name) {
            if (!game.achievements.includes(id)) {
                game.achievements.push(id);
                showAchievement(name);
            }
        }

        function showAchievement(name) {
            const popup = document.getElementById('achievementPopup');
            document.getElementById('achievementName').textContent = name;
            popup.classList.add('show');
            setTimeout(() => popup.classList.remove('show'), 3000);
        }

        function toggleModal(type) {
            const modal = document.getElementById('modal-' + type);
            if (modal) {
                modal.classList.toggle('show');
                if (type === 'upgrades') renderUpgrades();
            }
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        }

        function renderUpgrades() {
            const list = document.getElementById('upgradeList');
            list.innerHTML = '';
            
            const upgrades = [
                { id: 'maxNodes', name: 'Expand Network', desc: 'Add 5 more node slots', cost: 1000, effect: () => game.upgrades.maxNodes += 5 },
                { id: 'scanSpeed', name: 'Overclock Scanners', desc: 'Double scanner output', cost: 500, effect: () => game.upgrades.scanSpeed *= 2 },
                { id: 'cryptoEff', name: 'Crypto Optimization', desc: 'Double crypto mining', cost: 2000, effect: () => game.upgrades.cryptoEfficiency *= 2 }
            ];
            
            upgrades.forEach(upg => {
                const div = document.createElement('div');
                div.className = 'upgrade-item' + (game.resources.money < upg.cost ? ' disabled' : '');
                div.innerHTML = `
                    <div class="upgrade-info">
                        <h4>${upg.name}</h4>
                        <p>${upg.desc}</p>
                    </div>
                    <div class="upgrade-cost">$${formatNumber(upg.cost)}</div>
                `;
                div.onclick = () => {
                    if (game.resources.money >= upg.cost) {
                        game.resources.money -= upg.cost;
                        upg.effect();
                        renderUpgrades();
                        updateResources();
                    }
                };
                list.appendChild(div);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function clearAllNodes() {
            if (confirm('Delete all nodes? This cannot be undone.')) {
                game.nodes = [];
                game.connections = [];
                document.getElementById('nodeLayer').innerHTML = '';
                document.getElementById('connectionLayer').innerHTML = '';
                game.nodeIdCounter = 0;
            }
        }

        function saveLayout() {
            const data = JSON.stringify(game.nodes);
            localStorage.setItem('uploadLabsSave', data);
            showFloatingText(window.innerWidth/2, window.innerHeight/2, 'Layout Saved!');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Start
        init();
    </script>
</body>
</html>
