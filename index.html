<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Labs: Network Empire</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="particles" id="particlesContainer"></div>

    <!-- UI Overlay elements -->
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="Game.zoomIn()"><i class="fa-solid fa-plus"></i></button>
        <div class="zoom-level" id="zoomLevel">100%</div>
        <button class="zoom-btn" onclick="Game.zoomOut()"><i class="fa-solid fa-minus"></i></button>
        <button class="zoom-btn" onclick="document.getElementById('settingsModal').style.display='flex'"><i class="fa-solid fa-gear"></i></button>
    </div>

    <div class="event-log" id="eventLog"></div>

    <div class="game-container">
        <div class="header">
            <div class="header-title">UPLOAD LABS <span class="version-badge">v11.3</span></div>
            <div class="header-stats">
                <div class="stat-box money">
                    <div class="stat-value" id="moneyDisplay">$0</div>
                    <div class="stat-rate" id="moneyRate">+$0/s</div>
                </div>
                <div class="stat-box research">
                    <div class="stat-value" id="rpDisplay">0 RP</div>
                    <div class="stat-rate" id="rpRate">+0/s</div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">System Controls</div>
                <div class="action-row">
                    <button class="btn btn-research">Research</button>
                    <button class="btn btn-code">Code</button>
                    <button class="btn" onclick="document.getElementById('statsModal').style.display='flex'">Stats</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Router Heat</div>
                <div class="heat-track"><div class="heat-fill" id="heatBar"></div></div>
                <div id="heatText">0°C</div>
            </div>

            <div class="panel">
                <div class="panel-title">Storage</div>
                <div class="storage-bar-container">Files <span id="txtFiles">0</span><div class="storage-track"><div class="storage-fill" id="barFiles"></div></div></div>
                <div class="storage-bar-container">Images <span id="txtImages">0</span><div class="storage-track"><div class="storage-fill" id="barImages"></div></div></div>
                <div class="storage-bar-container">Videos <span id="txtVideos">0</span><div class="storage-track"><div class="storage-fill" id="barVideos"></div></div></div>
            </div>
        </div>

        <div class="canvas-viewport" id="viewport">
            <div class="world" id="world">
                <div class="grid-bg"></div>
                <svg class="connections-layer" id="cables"></svg>
                <div id="nodes"></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="tabs">
                <div class="tab active" data-tab="infra">Infra</div>
                <div class="tab" data-tab="download">Download</div>
                <div class="tab" data-tab="upload">Upload</div>
                <div class="tab" data-tab="advanced">Advanced</div>
                <div class="tab" data-tab="coding">Coding</div>
            </div>
            <div class="items-tray" id="tray"></div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu" style="display:none; position:fixed; z-index:10000; background:#1a2332; border:1px solid #3b82f6; padding:10px; border-radius:8px;">
        <div class="ctx-item" onclick="Game.upgradeNode()">Upgrade</div>
        <div class="ctx-item" onclick="Game.deleteNode()" style="color:red">Delete</div>
    </div>

    <!-- Modals (Simplified for brevity but functional) -->
    <div id="researchModal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h2>Research</h2><button onclick="this.closest('.modal-overlay').style.display='none'">X</button></div><div class="modal-body" id="researchTreeGrid"></div></div></div>
    <div id="statsModal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h2>Statistics</h2><button onclick="this.closest('.modal-overlay').style.display='none'">X</button></div><div class="modal-body" id="statsGrid"></div></div></div>
    <div id="settingsModal" class="modal-overlay" style="display:none"><div class="modal"><div class="modal-header"><h2>Settings</h2><button onclick="this.closest('.modal-overlay').style.display='none'">X</button></div><div class="modal-body">Settings content...</div></div></div>

</body>
</html>
